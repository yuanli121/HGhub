name: iOS Build

# 整合版：iOS 构建。macOS runner + Xcode 出 ipa。
# 触发：Actions 页手动运行（workflow_dispatch 可填版本号）。
# 签名：配置 APPLE_CERTIFICATE 等 secrets 则出正式签名包（可直接安装）；
#       未配置则出 ad-hoc ipa，需用 Sideloadly / AltStore 用自己的 Apple ID 重签侧载（7 天有效期）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则用 package.json 当前版本）"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  ios:
    name: iOS (ipa)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐
        id: ver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="$(node -p "require('./package.json').version")"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json','src-tauri/Cargo.toml']){let t=fs.readFileSync(p,'utf8');t=t.replace(/(\"?version\"?\s*[:=]\s*\")([0-9.]+)(\")/,'\$1'+process.argv[1]+'\$3');fs.writeFileSync(p,t)}" "$V"

      - name: 处理 iOS 签名配置
        shell: bash
        run: |
          # 有团队 ID secret 就用正式签名；没有则清掉占位符走 ad-hoc
          if [ -n "${APPLE_TEAM_ID:-}" ]; then
            node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p));j.bundle.iOS.developmentTeam=process.env.APPLE_TEAM_ID;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          else
            node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p));delete j.bundle.iOS.developmentTeam;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios

      - run: pnpm install --frozen-lockfile

      - name: 生成 iOS 工程
        run: pnpm tauri ios init --ci

      - name: 构建 ipa
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            pnpm tauri ios build
          else
            # 无证书：直接补丁 pbxproj（Automatic→Manual、清 team），tauri CLI 内部传参
            # 覆盖不了环境变量，改工程文件最稳。tauri 的 ipa 打包即使失败也不阻断，
            # 归档步骤用 DerivedData 里的 .app 打 Payload 出 unsigned ipa（SideStore 可重签侧载）
            echo "::warning::未配置 Apple 签名证书，输出 unsigned ipa（需 SideStore/AltStore 重签侧载）"
            PBX="src-tauri/gen/apple/huangguo-client.xcodeproj/project.pbxproj"
            python3 - "$PBX" <<'EOF'
import sys, re
p = sys.argv[1]
t = open(p).read()
t = t.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
t = re.sub(r'DEVELOPMENT_TEAM = [A-Z0-9]+;', '', t)
t = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = "[^"]*";', 'PROVISIONING_PROFILE_SPECIFIER = "";', t)
open(p, 'w').write(t)
print('pbxproj patched: Manual signing, no team')
EOF
            export CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
            pnpm tauri ios build || echo "::warning::tauri ios build 返回非零，尝试用 .app 产物兜底打包"
          fi

      - name: 归档 ipa
        run: |
          mkdir -p artifacts
          # tauri 用系统默认 DerivedData，产物不在 gen/apple 下
          DERIVED="$HOME/Library/Developer/Xcode/DerivedData"
          find "$DERIVED" -name '*.ipa' -exec cp {} artifacts/ \; 2>/dev/null || true
          if ! ls artifacts/*.ipa >/dev/null 2>&1; then
            # 兜底：手动打 unsigned ipa（Payload 打包法）
            APPDIR="$(find "$DERIVED" -path '*Release-iphoneos*' -name '*.app' -type d 2>/dev/null | head -1)"
            if [ -n "$APPDIR" ]; then
              echo "using app: $APPDIR"
              mkdir -p Payload && cp -R "$APPDIR" Payload/ && zip -qr "artifacts/HGhub-integrated_${{ steps.ver.outputs.version }}_ios.ipa" Payload && rm -rf Payload
            else
              echo "::error::没有找到 ipa 或 app 产物"; exit 1
            fi
          fi
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: artifacts/*
          if-no-files-found: error
